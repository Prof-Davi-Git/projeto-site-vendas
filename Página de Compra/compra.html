<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Página de Compra</title>

    <link rel="stylesheet" href="compra.css">

</head>


<body>


    <div class="barra-topo">

        FRETE GRÁTIS PARA TODO O PAÍS 🚚

    </div>



    <header>

        <img
            src="/Imagens/LOJA TESTE (1).png"
            alt="Logo da loja"
        >

    </header>



    <nav class="menu">

        <a href="/Página de Início/inicio.html">
            INÍCIO
        </a>

        <a href="/Página de Produtos/produtos.html">
            PRODUTOS
        </a>

        <a href="#">
            PROMOÇÕES
        </a>

        <a href="/Página de Contatos/contato.html">
            CONTATO
        </a>

    </nav>



    <main class="pagina-compra">


        <!-- FOTOS -->

        <section class="galeria">


            <!-- AS MINIATURAS SERÃO CRIADAS PELO JS -->

            <div
                class="miniaturas"
                id="miniaturas"
            >
            </div>



            <!-- FOTO PRINCIPAL -->

            <div class="foto-principal">

                <img
                    id="imagemPrincipal"
                    src="/Imagens/Produto teste.webp"
                    alt="Produto"
                >

            </div>


        </section>



        <!-- INFORMAÇÕES -->

        <section class="informacoes">


            <p
                class="categoria"
                id="categoriaProduto"
            >
            </p>


            <h1 id="nomeProduto">
            </h1>


            <h2 id="precoProduto">
            </h2>


            <p
                class="descricao"
                id="descricaoProduto"
            >
            </p>


            <hr>



            <!-- MODELO ESCOLHIDO -->

            <div class="modelo">


                <p>
                    Modelo selecionado:
                </p>


                <h3 id="nomeModelo">
                </h3>


                <p id="especificacaoModelo">
                </p>


            </div>



            <!-- TAMANHOS -->

            <div
                class="area-tamanhos"
                id="areaTamanhos"
            >


                <p>
                    Escolha o tamanho:
                </p>


                <div
                    class="tamanhos"
                    id="tamanhos"
                >
                </div>


            </div>



            <!-- AINDA SEM FUNÇÃO -->

            <button class="botao-carrinho">

                ADICIONAR AO CARRINHO

            </button>


        </section>


    </main>



    <script src="compra.js"></script>


</body>

</html>
