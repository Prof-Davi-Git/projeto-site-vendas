<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Comprar Produto</title>

    <link
        rel="stylesheet"
        href="compra.css"
    >

</head>


<body>


    <!-- BARRA SUPERIOR -->

    <div class="barra-topo">

        FRETE GRÁTIS PARA TODO O PAÍS 🚚

    </div>



    <!-- CABEÇALHO -->

    <header>

        <img
            src="../Imagens/LOJA TESTE (1).png"
            alt="Logo da loja"
        >

    </header>



    <!-- MENU -->

    <nav class="menu">

        <a href="../Página de Início/inicio.html">
            INÍCIO
        </a>

        <a href="../Página de Produtos/produtos.html">
            PRODUTOS
        </a>

        <a href="#">
            PROMOÇÕES
        </a>

        <a href="../Página de Contatos/contato.html">
            CONTATO
        </a>

    </nav>



    <!-- PRODUTO -->

    <main class="pagina-compra">


        <!-- GALERIA -->

        <section class="galeria">


            <div
                class="miniaturas"
                id="miniaturas"
            >
            </div>



            <div class="foto-principal">

                <img
                    id="imagemPrincipal"
                    src="../Imagens/Produto teste.webp"
                    alt="Produto"
                >

            </div>


        </section>



        <!-- INFORMAÇÕES -->

        <section class="informacoes">


            <p
                class="categoria"
                id="categoriaProduto"
            >
            </p>


            <h1 id="nomeProduto">
            </h1>


            <h2 id="precoProduto">
            </h2>


            <p
                class="descricao"
                id="descricaoProduto"
            >
            </p>


            <hr>



            <!-- MODELO -->

            <div class="modelo">

                <p>
                    Modelo selecionado:
                </p>


                <h3 id="nomeModelo">
                </h3>


                <p id="especificacaoModelo">
                </p>

            </div>



            <!-- TAMANHOS -->

            <div
                class="area-tamanhos"
                id="areaTamanhos"
            >

                <p>
                    Escolha o tamanho:
                </p>


                <div
                    class="tamanhos"
                    id="tamanhos"
                >
                </div>

            </div>



            <!-- AINDA SEM FUNÇÃO -->

            <button class="botao-carrinho">

                ADICIONAR AO CARRINHO

            </button>


        </section>


    </main>



    <script src="compra.js"></script>


</body>

</html>
